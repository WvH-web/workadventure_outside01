<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Kollegium</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#172b24;font:15px/1.5 system-ui,sans-serif;letter-spacing:0}
    header{padding:24px;border-bottom:3px solid #bc953e;background:#173b2f;color:#fff}h1{font-size:24px;margin:0;font-weight:650}
    main{padding:8px 24px 28px;max-width:760px;margin:auto}section{padding-top:20px}h2{font-size:14px;text-transform:uppercase;color:#53655a;margin:0 0 8px}
    ul{padding:0;margin:0;list-style:none}a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:13px 0;border-bottom:1px solid #d9e1dc;color:#173b2f;text-decoration:none;overflow-wrap:anywhere}
    a:hover,a:focus-visible{color:#7a4d15;text-decoration:underline}a:focus-visible{outline:2px solid #bc953e;outline-offset:3px}a::after{content:'\2197';font-size:20px;flex:none}
    #status{padding:24px;color:#53655a;font-size:14px}section:empty{display:none}
  </style>
  <script src="https://together.deine-schule.com/iframe_api.js"></script>
</head>
<body>
  <header><h1>Kollegium</h1></header>
  <main id="content"><p id="status" role="status">Wird geladen ...</p></main>
  <script type="module">
    try {
      await WA.onInit();
      const map = await WA.room.getTiledMap();
      const raw = map.properties?.find((p) => p.name === 'teacherLoungeResources')?.value;
      const items = JSON.parse(typeof raw === 'string' ? raw : '[]');
      const content = document.getElementById('content'); content.replaceChildren();
      for (const [kind, label] of [['meeting', 'Besprechungen'], ['tools', 'Werkzeuge'], ['leisure', 'Freizeit']]) {
        const selected = items.filter((item) => item.kind === kind);
        if (!selected.length) continue;
        const section = document.createElement('section'), title = document.createElement('h2'), list = document.createElement('ul');
        title.textContent = label; section.append(title, list); content.append(section);
        for (const item of selected) {
          const url = new URL(item.url); if (url.protocol !== 'https:') continue;
          const row = document.createElement('li'), link = document.createElement('a');
          link.textContent = item.label; link.href = url.href; link.target = '_blank'; link.rel = 'noopener noreferrer';
          row.append(link); list.append(row);
        }
      }
    } catch {
      document.getElementById('content').textContent = 'Die Verknuepfungen sind gerade nicht erreichbar.';
    }
  </script>
</body>
</html>
