<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hallenansagen</title>
  <link rel="stylesheet" href="/castle-audio/widget.css">
  <script src="/iframe_api.js" defer></script>
  <script src="/castle-audio/vendor/livekit-client.umd.js" defer></script>
  <script src="/castle-audio/vendor/lucide.min.js" defer></script>
  <script src="/castle-audio/widget.js" defer></script>
</head>
<body>
  <section id="panel" aria-label="Hallenansagen">
    <header>
      <div class="heading"><span id="signal" aria-hidden="true"></span><strong>Hallenansagen</strong></div>
      <button id="unlock" type="button" title="Ansagen anh&ouml;ren" aria-label="Ansagen anh&ouml;ren" hidden><i data-lucide="volume-2"></i></button>
      <button id="mute" type="button" title="Mikrofon stummschalten" aria-label="Mikrofon stummschalten" hidden><i data-lucide="mic-off"></i></button>
      <button id="stop" type="button" title="Ansage beenden" aria-label="Ansage beenden" hidden><i data-lucide="square"></i></button>
    </header>
    <p id="status" role="status" aria-live="polite">Verbindung wird aufgebaut</p>
    <form id="claim" hidden>
      <label for="code">Pultcode</label>
      <div class="entry"><input id="code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="128" required><button id="start" type="submit">Ansage starten</button></div>
    </form>
    <p id="error" role="alert" hidden></p>
  </section>
  <div id="audio" hidden></div>
</body>
</html>
