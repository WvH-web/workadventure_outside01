<!doctype html><html lang="de" data-mode="game"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="castle-home-invite-base" content="/castle-homes/"><title>Mein Schlosszimmer</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./view-tools.css"><link rel="stylesheet" href="/castle-homes/room.css"></head><body>
<main class="studio"><header class="top"><div><h1>Mein <em>Schlosszimmer</em></h1></div><div class="top-actions"><a href="../">Zum Schloss</a><button id="sound" aria-pressed="false" aria-label="Klaenge einschalten">Klaenge aus</button><div class="wallet"><strong id="balance">0</strong><span>Punkte</span></div></div></header>
<div class="notice"><span id="account-name">Dein Schlosszimmer</span><p></p><button id="add-points" hidden>Testpunkte</button><span id="room-code" hidden></span></div>
<div class="workspace"><section class="room-column" aria-label="Dein Schlosszimmer"><div class="room-toolbar"><div class="mode-switch" role="group" aria-label="Zimmermodus"><button id="edit-mode" aria-pressed="true">Einrichten</button><button id="walk-mode" aria-pressed="false">Im Zimmer laufen</button></div><div class="view-tools"><button id="zoom" aria-pressed="false">Naeher ansehen</button><span id="saved" role="status">Dein Zimmer wird geladen ...</span></div></div>
<div class="scene-wrap" id="scene-wrap"><canvas id="room" width="1672" height="941" tabindex="0" aria-label="Dein Schlosszimmer"></canvas><div id="placement-legend" class="placement-legend" hidden><span class="allowed">Hier passt dein Moebel</span><span class="blocked">Belegt oder gesperrt</span></div><div id="loading" class="loading"><span>Dein Zimmer wird vorbereitet ...</span></div><div id="scene-toast" class="scene-toast" role="status" aria-live="polite"></div></div>
<div id="finish-preview" class="finish-preview" hidden><span id="preview-label"></span><button id="preview-cancel">Vorschau schliessen</button><button id="preview-apply" class="gold"></button></div><div class="room-bottom"><p id="instruction"></p><button id="undo" disabled>Rueckgaengig</button></div>
<section id="selection" class="selection" aria-label="Ausgewaehltes Moebel"><div><h2 id="selected-name">Deine Einrichtung</h2><p id="selected-note"></p></div><div id="selected-actions" class="selected-actions" hidden><select id="copy-select" aria-label="Exemplar auswaehlen" hidden></select><button id="place-selected" hidden>Aufstellen</button><button id="use" class="gold" hidden>Benutzen</button><button id="next-slot" hidden>Anderer Stellplatz</button><button id="store">Ins Inventar</button><button id="deselect" aria-label="Auswahl aufheben">&times;</button></div></section></section>
<aside class="shop" aria-label="Einrichtung auswaehlen"><div class="shop-head"><h2>Deine Einrichtung</h2><div class="catalog-tabs" role="group" aria-label="Katalogansicht"><button id="furniture-tab" aria-pressed="true">Moebel</button><button id="finishes-tab" aria-pressed="false">Farben &amp; Materialien</button></div><label class="sr-only" for="search">Katalog durchsuchen</label><input id="search" type="search" placeholder="Moebel suchen ..." aria-label="Moebel suchen"><label class="sr-only" for="filter">Moebelkategorie</label><select id="filter" aria-label="Moebelkategorie"><option value="all">Alle Moebel</option><option value="owned">Mein Inventar</option><option>Schlafen &amp; Wohnen</option><option>Tische &amp; Aufbewahrung</option><option>Licht &amp; Textilien</option><option>Dekoration</option><option>Sport &amp; Hobby</option><option>Spa&szlig; &amp; Magie</option></select></div><div id="items" class="items"></div></aside></div></main><script type="module" src="./app.js"></script></body></html>
