<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schloss-Billard</title><link rel="stylesheet" href="/castle-billiards/billiards.css">
<script defer src="/castle-content/vendor/lucide.min.js"></script><script type="module" src="/castle-billiards/billiards.js"></script></head>
<body>
<header><h1>Billard</h1><span id="connection" role="status">Schulzugang wird gepr&uuml;ft</span><button id="camera" class="icon" title="Ansicht wechseln" aria-label="Ansicht wechseln"><i data-lucide="rotate-3d" aria-hidden="true"></i></button><a class="icon" href="/castle-billiards/credits.html" target="_blank" rel="noopener" title="Mitwirkende und Lizenzen" aria-label="Mitwirkende und Lizenzen"><i data-lucide="info" aria-hidden="true"></i></a></header>
<div id="message" role="alert" hidden></div>
<div id="graphics-state" role="alert" hidden>Die 3D-Ansicht wird wiederhergestellt.</div>
<div class="seats"><button id="seat-0" disabled>Platz 1</button><button id="seat-1" disabled>Platz 2</button><button id="resume" hidden disabled>Platz &uuml;bernehmen</button><button id="leave-seat" class="icon" hidden disabled title="Platz freigeben" aria-label="Platz freigeben"><i data-lucide="log-out" aria-hidden="true"></i></button><span id="self"></span></div>
<main id="scene" aria-label="Billardtisch"><canvas id="table" tabindex="0" aria-label="Billardtisch mit Kugeln"></canvas></main>
<section class="controls">
<div class="status"><strong id="status" role="status">Keine Partie ge&ouml;ffnet</strong><span id="groups"></span><button id="resign" class="icon" title="Partie aufgeben" aria-label="Partie aufgeben" disabled><i data-lucide="flag" aria-hidden="true"></i></button><button id="rematch" hidden disabled>Neue Partie</button><button id="reset" class="icon" hidden disabled title="Tisch zur&uuml;cksetzen" aria-label="Tisch zur&uuml;cksetzen"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button></div>
<div class="shot-controls"><div class="sliders"><label for="angle">Richtung</label><input id="angle" type="range" min="-180" max="180" step="0.1" value="0" disabled><output id="angle-value" for="angle">0&deg;</output>
<label for="power">St&auml;rke</label><input id="power" type="range" min="1" max="100" step="1" value="53" disabled><output id="power-value" for="power">53%</output></div><button id="spin" class="icon" disabled title="Effet einstellen" aria-label="Effet einstellen"><i data-lucide="crosshair" aria-hidden="true"></i></button><button id="shoot" disabled><i data-lucide="arrow-up-right" aria-hidden="true"></i><span>Sto&szlig;en</span></button></div>
<button id="place" hidden disabled>Wei&szlig;e Kugel setzen</button>
</section>
<dialog id="confirm"><form method="dialog"><h2 id="confirm-title"></h2><div class="dialog-actions"><button value="cancel">Abbrechen</button><button value="yes">Best&auml;tigen</button></div></form></dialog>
<dialog id="spin-dialog"><form method="dialog"><h2>Effet</h2><label for="spin-x">Seiteneffet</label><input id="spin-x" type="range" min="-45" max="45" value="0"><label for="spin-y">Nachlauf / R&uuml;cklauf</label><input id="spin-y" type="range" min="-45" max="45" value="0"><div class="dialog-actions"><button id="spin-clear" type="button">Neutral</button><button value="yes">&Uuml;bernehmen</button></div></form></dialog>
</body></html>
