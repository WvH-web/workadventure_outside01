<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schlossklavier</title><link rel="stylesheet" href="./piano.css"><link rel="stylesheet" href="./keys.css"><script src="/castle-content/vendor/lucide.min.js" defer></script><script src="./piano.js" type="module"></script></head>
<body><main>
  <header><img class="room-view" src="/castle-school/round-rooms/musikzimmer.webp" width="52" height="44" alt="Musiksalon im Schulschloss"><div class="room-title"><p class="eyebrow">Musiksalon</p><h1>Schlossklavier</h1></div><a class="icon" href="./credits.html" target="_blank" rel="noopener" title="Klavier &amp; Klangquellen" aria-label="Klavier und Klangquellen"><i data-lucide="info"></i></a></header>
  <div class="status"><span id="connection" role="status">Schulzugang wird gepr&uuml;ft &hellip;</span><span id="role"></span></div>
  <p id="message" class="message" role="alert" hidden></p>
  <div class="toolbar"><fieldset class="segments" id="modes" disabled><legend class="sr-only">Spielweise</legend><label><input type="radio" name="mode" value="together" checked><span>Gemeinsam</span></label><label><input type="radio" name="mode" value="practice"><span>Allein &uuml;ben</span></label></fieldset><button id="reconnect" class="icon" type="button" title="Verbindung erneuern" aria-label="Verbindung erneuern"><i data-lucide="refresh-cw"></i></button></div>
  <section class="instrument" aria-label="Klavier"><div class="lid"><span>WVH</span><span id="register">C4 &ndash; C6</span></div><div id="keyboard" role="group" aria-label="Klaviatur" aria-disabled="true"></div><div class="rail"></div></section>
  <div class="controls"><div class="octaves"><button id="lower" class="icon" type="button" title="Tieferes Register" aria-label="Tieferes Register" disabled><i data-lucide="chevron-left"></i></button><span id="octave-label">C4</span><button id="higher" class="icon" type="button" title="H&ouml;heres Register" aria-label="H&ouml;heres Register" disabled><i data-lucide="chevron-right"></i></button></div><label class="volume" title="Eigene Lautst&auml;rke"><i data-lucide="volume-2"></i><span class="sr-only">Lautst&auml;rke</span><input id="volume" type="range" min="0" max="100" value="55"></label><button id="clear" class="icon" type="button" title="Eigene T&ouml;ne beenden" aria-label="Eigene T&ouml;ne beenden" disabled><i data-lucide="square"></i></button></div>
  <div class="foot"><label class="pedal"><input id="pedal" type="checkbox" disabled> Haltepedal</label><button id="panic" type="button" class="icon" title="Alle T&ouml;ne beenden" aria-label="Alle T&ouml;ne beenden" hidden><i data-lucide="bell-off"></i></button></div>
  <div id="players" aria-label="Am Klavier"></div>
  <div class="actions"><button id="start" class="primary" type="button" disabled><i data-lucide="piano"></i><span>Klavier spielen</span></button><button id="takeover" type="button" hidden>Hier fortsetzen</button></div>
</main></body></html>
