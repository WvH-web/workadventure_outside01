<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spielrunden im Schloss</title><link rel="stylesheet" href="/castle-school/games.css">
  <script defer src="/castle-content/vendor/lucide.min.js"></script>
  <script type="module" src="/castle-school/games.js"></script>
</head>
<body>
  <header><div class="heading"><i data-lucide="dices" aria-hidden="true"></i><h1>Spielrunden</h1></div>
    <button class="icon-button" id="refresh" type="button" title="Neu pr&uuml;fen" aria-label="Neu pr&uuml;fen"><i data-lucide="refresh-cw" aria-hidden="true"></i></button>
  </header>
  <div id="account" class="account" role="status">Schulzugang wird gepr&uuml;ft &hellip;</div>
  <div id="message" class="message" role="status" hidden></div>
  <label class="mobile-offers" for="offer-select">Spielangebot<select id="offer-select"><option value="" disabled selected>Keine Runde ge&ouml;ffnet</option></select></label>
  <main>
    <nav id="games-list" aria-label="Spielangebote" aria-busy="true"></nav>
    <section id="detail" aria-labelledby="detail-title">
      <div class="detail-heading"><h2 id="detail-title">Keine Runde ge&ouml;ffnet</h2><span id="mode" class="badge" hidden></span></div>
      <p id="availability" class="muted"></p>
      <div id="lobby" hidden>
        <div class="room-link"><span id="current-url" dir="ltr"></span><button class="icon-button" id="copy" type="button" title="Aktuellen Raumlink kopieren" aria-label="Aktuellen Raumlink kopieren"><i data-lucide="copy" aria-hidden="true"></i></button></div>
        <div class="commands"><button class="primary" id="join" type="button"><i data-lucide="play" aria-hidden="true"></i><span>Spiel &ouml;ffnen</span></button>
          <button id="external" type="button" hidden><i data-lucide="external-link" aria-hidden="true"></i><span>Neuer Tab</span></button></div>
        <details id="host"><summary><i data-lucide="link" aria-hidden="true"></i>Raumlink &auml;ndern</summary>
          <form id="room-form">
            <label for="room-url">Neuer Raumlink</label><input id="room-url" name="targetUrl" type="url" maxlength="2048" required autocomplete="off" spellcheck="false">
            <div class="host-submit"><label for="pin">Moderator-PIN<input id="pin" name="pin" type="password" pattern="[0-9]{4,12}" minlength="4" maxlength="12" inputmode="numeric" required autocomplete="off"></label>
              <button id="save" type="submit"><i data-lucide="check" aria-hidden="true"></i>Speichern</button></div>
          </form>
        </details>
      </div>
      <section id="viewer" aria-label="Ge&ouml;ffnetes Spiel" hidden>
        <div class="viewer-heading"><span id="viewer-title"></span><button id="close-viewer" class="icon-button" type="button" title="Spiel schlie&szlig;en" aria-label="Spiel schlie&szlig;en"><i data-lucide="x" aria-hidden="true"></i></button></div>
        <div id="frame-slot"></div>
      </section>
    </section>
  </main>
</body>
</html>
