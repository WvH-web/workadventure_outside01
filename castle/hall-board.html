<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schlossbrett</title><style>
html,body{margin:0;width:100%;height:100%;background:#382124;color:#f1d18a;font-family:Georgia,serif;letter-spacing:0}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;text-align:center}
main{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px;box-sizing:border-box}
h1{font-size:12px;line-height:1.2;margin:0;font-weight:600}p{font-size:9px;line-height:1.3;margin:0;color:#e0c4ae}
img{max-width:100%;min-height:0;flex:1;object-fit:contain}img[hidden]{display:none}
</style></head><body><main><h1 id="title">Schlossbrett</h1><img id="picture" hidden alt=""><p id="status">Aktuelle Ankündigungen</p></main>
<script type="module">
const endpoint="https://deutsche-online-schule.com/schooltools/verwaltung/api/workadventure_museum.php?board=hallnotice01";
async function refresh(){
 try{const response=await fetch(endpoint,{cache:"no-store"});if(!response.ok)return;const {item}=await response.json();
  document.getElementById("title").textContent=item?.title||"Schlossbrett";
  const picture=document.getElementById("picture");
  if(item?.image_url){const url=new URL(item.image_url);if(["https:"].includes(url.protocol)){picture.src=url.href;picture.hidden=false;document.getElementById("status").hidden=true;}}
  else{picture.hidden=true;picture.removeAttribute("src");document.getElementById("status").hidden=false;document.getElementById("status").textContent=item?"Aktuelle Ankündigung":"Noch keine Ankündigung";}
 }catch{}
}
refresh();setInterval(refresh,60000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
</script></body></html>
