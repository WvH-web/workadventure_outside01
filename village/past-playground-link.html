<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PAST Playground</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, sans-serif;
      background: #15212c;
      color: #f5f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }

    main {
      width: min(440px, 100%);
      display: grid;
      gap: 16px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    p {
      margin: 0;
      color: #c8d2df;
      line-height: 1.45;
    }

    a {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
      border-radius: 8px;
      background: #3f5af5;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <h1>PAST Playground</h1>
    <p>Die externe Map wird in einem neuen Tab geoeffnet. Falls dort ein Zugriffsfehler erscheint, liegt die Freigabe noch bei PAST/100 Roads.</p>
    <a href="https://play.workadventu.re/@/past-foundation/past-foundation/playground#entry/entry-3" target="_blank" rel="noopener noreferrer">Playground oeffnen</a>
  </main>
</body>
</html>
