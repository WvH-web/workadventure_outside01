<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stumble Guys</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101522;
      color: #fff;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: #172033;
      border-bottom: 3px solid #f3b91f;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.32);
      z-index: 1;
    }

    strong {
      flex: 0 0 auto;
      font-size: 18px;
      line-height: 1.2;
      color: #f3b91f;
      text-transform: uppercase;
    }

    span {
      flex: 1 1 auto;
      min-width: 0;
      font-size: 15px;
      line-height: 1.35;
    }

    a {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-radius: 6px;
      background: #2384ff;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    iframe {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: 0;
      background: #fff;
    }

    @media (max-width: 720px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
      }

      a {
        width: 100%;
        box-sizing: border-box;
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header>
    <strong>Stumble Guys</strong>
    <span>Das Spiel kann lange laden. Bitte nicht auf &quot;Jetzt spielen&quot; klicken, sondern oben auf den Knopf &quot;Spielen&quot;.</span>
    <a href="https://www.stumbleguys.com/de" target="_blank" rel="noopener noreferrer">Extern oeffnen</a>
  </header>
  <iframe
    src="https://www.stumbleguys.com/de"
    title="Stumble Guys"
    allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; gamepad"
    referrerpolicy="no-referrer-when-downgrade"></iframe>
</body>
</html>
