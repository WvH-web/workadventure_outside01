<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
      }

      .badge {
        box-sizing: border-box;
        display: flex;
        align-items: center;
        gap: 10px;
        width: 286px;
        margin: 6px auto 0;
        padding: 10px 14px;
        border: 2px solid rgba(255, 255, 255, 0.9);
        border-radius: 12px;
        background: rgba(18, 31, 42, 0.94);
        color: #fff;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }

      .icon {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 999px;
        background: #eb5c45;
        font-size: 13px;
        font-weight: 700;
      }

      .title {
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .text {
        margin-top: 2px;
        font-size: 11px;
        opacity: 0.86;
      }
    </style>
  </head>
  <body>
    <div class="badge">
      <div class="icon">MIC</div>
      <div>
        <div class="title">SPEAKER AKTIV</div>
        <div class="text">Alle im Raum hoeren dich.</div>
      </div>
    </div>
  </body>
</html>
