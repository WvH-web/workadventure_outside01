<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html,
    body {
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
    }

    .hint {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      border-radius: 14px;
      background: rgba(27, 42, 65, 0.9);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }

    kbd {
      margin-left: 8px;
      padding: 3px 8px;
      border-radius: 7px;
      background: #f5f2e8;
      color: #1b2a41;
      font: inherit;
    }
  </style>
</head>
<body>
  <div class="hint">
    <span>Aussteigen <kbd>Esc</kbd></span>
  </div>
</body>
</html>
