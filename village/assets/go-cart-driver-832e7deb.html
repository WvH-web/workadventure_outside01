<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 5px 3px rgba(0, 0, 0, 0.42));
      transform-origin: center bottom;
      animation: cart-bob 0.38s infinite alternate ease-in-out;
    }

    @keyframes cart-bob {
      from { transform: translateY(0); }
      to { transform: translateY(-1px); }
    }
  </style>
</head>
<body>
  <img src="./go-cart-driver-red.png" alt="">
  <script>
    const allowedColors = new Set(["red", "blue", "green", "yellow", "violet"]);
    const params = new URLSearchParams(window.location.search);
    const color = params.get("color") || "red";
    const safeColor = allowedColors.has(color) ? color : "red";
    document.querySelector("img").src = `./go-cart-driver-${safeColor}.png`;
  </script>
</body>
</html>
