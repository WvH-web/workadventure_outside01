<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --screen: #101412;
        --frame: #f5cd62;
        --frame-light: #fff2a8;
        --frame-dark: #8c6924;
        --shadow: rgba(41, 24, 14, 0.34);
        --glow: rgba(246, 210, 92, 0.28);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      .screen {
        position: relative;
        width: 94%;
        height: 78%;
        border: min(5px, 6vmin) solid var(--frame);
        border-top-color: var(--frame-light);
        border-bottom-width: min(10px, 10vmin);
        border-radius: min(9px, 8vmin);
        background:
          radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.06), transparent 38%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 42%),
          var(--screen);
        box-shadow:
          inset 0 0 0 min(2px, 2vmin) var(--frame-dark),
          0 min(2px, 2vmin) 0 rgba(255, 255, 255, 0.38),
          0 min(7px, 7vmin) min(14px, 14vmin) var(--shadow),
          0 0 min(18px, 18vmin) var(--glow);
      }

      .screen::before,
      .screen::after {
        content: "";
        position: absolute;
        bottom: max(-16px, -14vmin);
        width: min(9px, 8vmin);
        height: min(18px, 15vmin);
        border-radius: min(4px, 4vmin) min(4px, 4vmin) 0 0;
        background: linear-gradient(#9f7a2c, #4d3820);
        box-shadow: inset min(2px, 2vmin) 0 rgba(255, 255, 255, 0.22);
      }

      .screen::before {
        left: 17%;
      }

      .screen::after {
        right: 17%;
      }

      .rail {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: max(-23px, -20vmin);
        height: min(5px, 5vmin);
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #e2b249 16%, #fff0a2 50%, #e2b249 84%, transparent);
        box-shadow: 0 min(3px, 3vmin) min(7px, 7vmin) rgba(0, 0, 0, 0.2);
      }

      .speaker {
        position: absolute;
        bottom: max(-5px, -4vmin);
        width: min(13px, 12vmin);
        height: min(20px, 18vmin);
        border-radius: min(4px, 4vmin);
        background:
          radial-gradient(circle at 50% 32%, #26322e 0 28%, transparent 30%),
          radial-gradient(circle at 50% 70%, #26322e 0 24%, transparent 26%),
          linear-gradient(#58645e, #1b211f);
        box-shadow: 0 min(2px, 2vmin) min(5px, 5vmin) rgba(0, 0, 0, 0.26);
      }

      .speaker.left {
        left: max(-18px, -16vmin);
      }

      .speaker.right {
        right: max(-18px, -16vmin);
      }

      img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        border-radius: min(4px, 4vmin);
        opacity: 0;
        transition: opacity 180ms ease;
      }

      img.is-loaded + .shine {
        opacity: 1;
      }

      img.is-loaded {
        opacity: 1;
      }

      .shine {
        position: absolute;
        inset: min(4px, 4vmin);
        border-radius: min(4px, 4vmin);
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.22), transparent 34%);
        opacity: 0.72;
      }

      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .play::before {
        content: "";
        width: min(28px, 25%);
        aspect-ratio: 1;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 min(2px, 2vmin) min(8px, 8vmin) rgba(0, 0, 0, 0.24);
      }

      .play::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: min(7px, 6vmin) solid transparent;
        border-bottom: min(7px, 6vmin) solid transparent;
        border-left: min(12px, 11vmin) solid #13775f;
        transform: translateX(12%);
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <img alt="" />
      <div class="shine" aria-hidden="true"></div>
      <div class="play" aria-hidden="true"></div>
      <div class="speaker left" aria-hidden="true"></div>
      <div class="speaker right" aria-hidden="true"></div>
      <div class="rail" aria-hidden="true"></div>
    </div>
    <script>
      const API_URL =
        "https://deutsche-online-schule.com/schooltools/verwaltung/api/workadventure_museum.php";

      const params = new URLSearchParams(window.location.search);
      const board = params.get("board");
      const directImageUrl = params.get("image");
      const image = document.querySelector("img");

      function setImage(url) {
        if (typeof url !== "string" || url.trim() === "") {
          return;
        }
        image.addEventListener("load", () => image.classList.add("is-loaded"), { once: true });
        image.src = url;
      }

      async function loadMusicImage() {
        if (typeof directImageUrl === "string" && directImageUrl.trim() !== "") {
          setImage(directImageUrl);
          return;
        }

        if (!board || !/^musik0[1-7]$/.test(board)) {
          return;
        }

        const url = new URL(API_URL);
        url.searchParams.set("board", board);
        url.searchParams.set("_", String(Date.now()));

        const response = await fetch(url.toString(), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Museum API returned ${response.status}`);
        }

        const data = await response.json();
        setImage(data?.item?.image_url);
      }

      loadMusicImage().catch((error) => {
        console.error("Could not load music screen image", error);
      });
    </script>
  </body>
</html>
