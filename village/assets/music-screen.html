<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --screen: #101513;
        --frame: #f0c75e;
        --frame-dark: #755a27;
        --glow: rgba(246, 210, 92, 0.34);
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      body {
        display: grid;
        place-items: center;
      }

      .screen {
        position: relative;
        width: 96%;
        height: 82%;
        border: min(6px, 7vmin) solid var(--frame);
        border-bottom-width: min(9px, 10vmin);
        border-radius: min(10px, 9vmin);
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 38%),
          var(--screen);
        box-shadow:
          inset 0 0 0 min(2px, 2vmin) var(--frame-dark),
          0 min(8px, 8vmin) min(18px, 18vmin) rgba(0, 0, 0, 0.22),
          0 0 min(18px, 18vmin) var(--glow);
      }

      .screen::before,
      .screen::after {
        content: "";
        position: absolute;
        bottom: max(-16px, -14vmin);
        width: min(8px, 8vmin);
        height: min(17px, 15vmin);
        border-radius: min(4px, 4vmin);
        background: linear-gradient(#7f632c, #3e3020);
      }

      .screen::before {
        left: 18%;
      }

      .screen::after {
        right: 18%;
      }

      img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: center;
        border-radius: min(4px, 4vmin);
        opacity: 0;
        transition: opacity 180ms ease;
      }

      img.is-loaded {
        opacity: 1;
      }

      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }

      .play::before {
        content: "";
        width: min(30px, 28%);
        aspect-ratio: 1;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 min(2px, 2vmin) min(8px, 8vmin) rgba(0, 0, 0, 0.24);
      }

      .play::after {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-top: min(8px, 7vmin) solid transparent;
        border-bottom: min(8px, 7vmin) solid transparent;
        border-left: min(13px, 12vmin) solid #13775f;
        transform: translateX(12%);
      }
    </style>
  </head>
  <body>
    <div class="screen">
      <img alt="" />
      <div class="play" aria-hidden="true"></div>
    </div>
    <script>
      const API_URL =
        "https://deutsche-online-schule.com/schooltools/verwaltung/api/workadventure_museum.php";

      const params = new URLSearchParams(window.location.search);
      const board = params.get("board");
      const directImageUrl = params.get("image");
      const image = document.querySelector("img");

      function setImage(url) {
        if (typeof url !== "string" || url.trim() === "") {
          return;
        }
        image.addEventListener("load", () => image.classList.add("is-loaded"), { once: true });
        image.src = url;
      }

      async function loadMusicImage() {
        if (typeof directImageUrl === "string" && directImageUrl.trim() !== "") {
          setImage(directImageUrl);
          return;
        }

        if (!board || !/^musik0[1-7]$/.test(board)) {
          return;
        }

        const url = new URL(API_URL);
        url.searchParams.set("board", board);
        url.searchParams.set("_", String(Date.now()));

        const response = await fetch(url.toString(), { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Museum API returned ${response.status}`);
        }

        const data = await response.json();
        setImage(data?.item?.image_url);
      }

      loadMusicImage().catch((error) => {
        console.error("Could not load music screen image", error);
      });
    </script>
  </body>
</html>
