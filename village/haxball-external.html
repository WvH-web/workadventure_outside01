<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Haxball extern öffnen</title>
  <style>
    :root {
      color-scheme: light;
      --green: #0f7c67;
      --blue: #1d4f91;
      --ink: #10212d;
      --muted: #586975;
      --line: #d8e4de;
      --panel: #f7fbf8;
      --yellow: #f6c343;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(180deg, #eef8f2, #f8fbff);
      color: var(--ink);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(680px, 100%);
      border: 1px solid var(--line);
      border-top: 6px solid var(--green);
      border-radius: 8px;
      background: white;
      box-shadow: 0 22px 60px rgba(16, 33, 45, 0.12);
      overflow: hidden;
    }

    .hero {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 20px;
      align-items: center;
      padding: 28px;
      background: var(--panel);
    }

    .field {
      aspect-ratio: 1;
      border: 5px solid #f0f5ed;
      border-radius: 8px;
      background:
        linear-gradient(90deg, transparent 49%, rgba(255,255,255,.9) 49% 51%, transparent 51%),
        radial-gradient(circle at center, transparent 0 29%, rgba(255,255,255,.9) 30% 32%, transparent 33%),
        linear-gradient(#218643, #146b37);
      box-shadow: inset 0 0 0 3px #164f2d;
      position: relative;
    }

    .field::before,
    .field::after {
      content: "";
      position: absolute;
      top: 32%;
      width: 20%;
      height: 36%;
      border: 3px solid rgba(255,255,255,.9);
    }

    .field::before {
      left: 0;
      border-left: 0;
    }

    .field::after {
      right: 0;
      border-right: 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .content {
      padding: 28px;
    }

    .notice {
      padding: 16px 18px;
      border: 1px solid #f0df9a;
      border-radius: 8px;
      background: #fff8dc;
      color: #5d4300;
      font-weight: 650;
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 8px;
      color: white;
      background: var(--blue);
      text-decoration: none;
      font-size: 17px;
      font-weight: 750;
    }

    a.secondary {
      color: var(--green);
      background: #e8f3ef;
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .field {
        width: 112px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero">
      <div class="field" aria-hidden="true"></div>
      <div>
        <h1>Haxball</h1>
        <p>Haxball blockiert die direkte Einbettung in WorkAdventure. Öffne das Spiel deshalb in einem neuen Tab.</p>
      </div>
    </section>
    <section class="content">
      <div class="notice">
        Der Treffpunkt auf dem Feld bleibt aktiv: Wer in der Zone steht, kann mit den anderen dort sprechen.
      </div>
      <div class="actions">
        <a href="https://www.haxball.com/" target="_blank" rel="noopener noreferrer">Haxball extern öffnen</a>
        <a class="secondary" href="https://www.haxball.com/headless" target="_blank" rel="noopener noreferrer">Host-Info öffnen</a>
      </div>
    </section>
  </main>
</body>
</html>
