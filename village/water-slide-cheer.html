<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: "Trebuchet MS", Verdana, sans-serif;
    }

    .cheer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      box-sizing: border-box;
      width: 206px;
      padding: 10px 14px;
      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 26px;
      color: #1e2a35;
      background: linear-gradient(135deg, #ffffff 0%, #fff5b3 100%);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.32);
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.15;
      animation: pop 0.26s ease-out, float 0.9s ease-in-out infinite alternate;
    }

    .name {
      display: block;
      margin-bottom: 4px;
      color: #3d5a73;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .cheer::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -15px;
      width: 24px;
      height: 24px;
      transform: translateX(-50%) rotate(45deg);
      border-right: 3px solid rgba(255, 255, 255, 0.95);
      border-bottom: 3px solid rgba(255, 255, 255, 0.95);
      background: #fff5b3;
      box-shadow: 7px 7px 12px rgba(0, 0, 0, 0.12);
    }

    @keyframes pop {
      from {
        transform: translate(-50%, -50%) scale(0.65);
        opacity: 0;
      }

      to {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
      }
    }

    @keyframes float {
      from {
        margin-top: 0;
      }

      to {
        margin-top: -6px;
      }
    }
  </style>
</head>
<body>
  <div class="cheer">
    <span class="name" id="name"></span>
    <span id="cheer">Juhuuu!</span>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const name = params.get("name") || "";
    document.getElementById("name").textContent = name;
    document.getElementById("name").style.display = name ? "block" : "none";
    document.getElementById("cheer").textContent = params.get("text") || "Juhuuu!";
  </script>
</body>
</html>
