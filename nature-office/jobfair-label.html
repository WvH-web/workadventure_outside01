<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .label {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px 6px;
      color: #ffd94d;
      font-size: clamp(11px, 10vw, 20px);
      font-weight: 900;
      line-height: 1.05;
      text-align: center;
      text-shadow:
        0 2px 0 #6f3d00,
        0 0 4px rgba(44, 26, 0, .95),
        0 0 8px rgba(255, 217, 77, .48);
      overflow-wrap: anywhere;
    }

    .empty {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="label" class="label empty"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const label = document.getElementById("label");
    const job = (params.get("job") || "").trim();

    if (job) {
      label.textContent = job;
      label.classList.remove("empty");
    }
  </script>
</body>
</html>
