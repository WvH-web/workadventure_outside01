<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messestand Informationen</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      --green: #0f7f66;
      --blue: #235789;
      --gold: #f2c14e;
      --ink: #14211e;
      --muted: #62706c;
      --line: #d8e1dd;
      --paper: #ffffff;
      --bg: #eef4f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(15, 127, 102, 0.14), rgba(35, 87, 137, 0.1)),
        var(--bg);
      color: var(--ink);
    }

    main {
      width: min(760px, 100%);
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(20, 33, 30, 0.14);
    }

    .stripe {
      height: 7px;
      background: linear-gradient(90deg, var(--green), var(--blue), var(--gold));
    }

    section {
      padding: 26px;
    }

    p:first-child {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1;
    }

    p {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.5;
    }

    .hint {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #e8f2ee;
      color: #0b5f4d;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="stripe"></div>
    <section>
      <p>Messestand</p>
      <h1>Informationen folgen</h1>
      <p>
        Diese Flaeche ist als Platzhalter angelegt. Im Verwaltungsprogramm unter
        <strong>Messestaende</strong> kann hier spaeter die Webseite des Betriebs
        oder der Berufsinfo hinterlegt werden.
      </p>
      <div class="hint">Bereit fuer eure Inhalte</div>
    </section>
  </main>
</body>
</html>
