<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="1; url=https://play.workadventu.re/_/wvh-jobmesse/wvh-web.github.io/workadventure_outside01/nature-office/map.json">
  <title>WvH Jobmesse</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #152033;
      background: #eef6f3;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(620px, 100%);
      background: #fff;
      border: 1px solid rgba(21, 32, 51, .1);
      border-radius: 8px;
      box-shadow: 0 18px 48px rgba(21, 32, 51, .14);
      padding: 32px;
    }

    .kicker {
      color: #117865;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 10px 0 12px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.02;
    }

    p {
      color: #4b5b6f;
      font-size: 18px;
      line-height: 1.5;
      margin: 0 0 22px;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 20px;
      border-radius: 6px;
      background: #117865;
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      text-decoration: none;
    }

    .note {
      margin-top: 18px;
      font-size: 14px;
      color: #697789;
    }
  </style>
</head>
<body>
  <main>
    <div class="kicker">Wilhelm von Humboldt Online Privatschule</div>
    <h1>Jobmesse öffnen</h1>
    <p>Du wirst automatisch in den öffentlichen Messebereich weitergeleitet. Dort ist keine Microsoft-Anmeldung notwendig.</p>
    <a class="button" href="https://play.workadventu.re/_/wvh-jobmesse/wvh-web.github.io/workadventure_outside01/nature-office/map.json">Jobmesse starten</a>
    <div class="note">Falls die Weiterleitung nicht startet, bitte den Button verwenden.</div>
  </main>
</body>
</html>
