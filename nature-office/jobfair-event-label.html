<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .event-name {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8px;
      color: #ffe680;
      font-size: clamp(13px, 6.4vw, 27px);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
      letter-spacing: 0;
      text-shadow:
        0 2px 0 #5b3410,
        0 0 3px rgba(12, 14, 26, .9),
        0 0 8px rgba(255, 205, 48, .56),
        0 0 14px rgba(255, 255, 255, .22);
      transform: perspective(180px) rotateX(2deg);
    }
  </style>
</head>
<body>
  <div id="eventName" class="event-name">WvH Jobmesse</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const eventName = (params.get("event") || "WvH Jobmesse").trim();
    const label = document.getElementById("eventName");
    label.textContent = eventName || "WvH Jobmesse";

    function fitText() {
      let size = 27;
      label.style.fontSize = `${size}px`;
      while (label.scrollWidth > label.clientWidth && size > 11) {
        size -= 1;
        label.style.fontSize = `${size}px`;
      }
    }

    window.addEventListener("resize", fitText);
    requestAnimationFrame(fitText);
  </script>
</body>
</html>
